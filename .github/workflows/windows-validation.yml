name: Windows validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      release:
        description: Build Windows installer and portable release candidates
        type: boolean
        default: false
      upload_preview:
        description: Upload the verified four-profile preview to its existing draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !inputs.upload_preview }}
    name: Native Windows UI and packaging
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      VALIDATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Run security regression tests
        run: npm test
      - name: Validate native Electron session transport
        run: npm run test:electron
      - name: Validate public Twitch transport without an account
        run: node scripts/diagnose-twitch-public.cjs
      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Package Windows without publishing
        id: package
        run: |
          if ($env:BUILD_RELEASE -eq 'true') { npm run dist -- --win nsis --x64 --publish never }
          else { npm run dist -- --dir --publish never }
      - name: Validate packaged UI and official login navigation
        run: node scripts/validate-desktop.cjs
      - name: Validate four isolated profiles before release packaging
        if: success() && env.BUILD_RELEASE != 'true'
        timeout-minutes: 3
        run: node scripts/validate-profiles.cjs dist/win-unpacked/Twitchterino.exe validation-output/evidence/profile-validation.json
      - name: Prepare isolated manual validation bundle
        if: always() && steps.package.outcome == 'success'
        run: node scripts/package-windows-validation.cjs
      - name: Verify the manual bundle launcher
        if: always() && steps.package.outcome == 'success'
        run: ./validation-output/Start-WindowsValidation.ps1 -CheckOnly
      - name: Verify existing-profile selection stays inside the isolated profile root
        if: always() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $ProbeProfile = Join-Path $env:LOCALAPPDATA 'ChannelClientValidation/twitchterino/000000000000'
          New-Item -ItemType Directory -Path $ProbeProfile -Force | Out-Null
          try { ./validation-output/Start-WindowsValidation.ps1 -CheckOnly -ProfileCommit '000000000000' }
          finally { Remove-Item -LiteralPath $ProbeProfile -Force }
      - name: Prepare Windows release candidates
        if: success() && env.BUILD_RELEASE == 'true'
        run: node scripts/package-windows-release.cjs
      - name: Validate four simultaneous isolated portable profiles
        if: success() && env.BUILD_RELEASE == 'true'
        timeout-minutes: 3
        run: node scripts/validate-profiles.cjs
      - name: Archive portable profiles and calculate release checksums
        if: success() && env.BUILD_RELEASE == 'true'
        run: |
          $ReleaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path release-output/portable/* -DestinationPath "release-output/Twitchterino-$ReleaseVersion-Windows-x64-4-contas.zip"
          Get-ChildItem release-output -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name | ForEach-Object {
            $ReleaseHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$ReleaseHash  $($_.Name)"
          } | Set-Content -Encoding ascii release-output/SHA256SUMS.txt
      - name: Preserve verified Windows release candidates
        if: success() && env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ github.sha }}
          path: |
            release-output/*.exe
            release-output/*.zip
            release-output/*.txt
            release-output/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Windows evidence and validation build
        # The launcher checks hashes without opening another GUI during CI.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation-output/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn

  upload-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_preview
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e06d73989dc900bdef758f65e5c3364b2f3a19aa
          persist-credentials: false
      - name: Download the pinned native Windows application
        run: gh run download 42043222629 --repo jggomes11/twitchterino --name windows-validation-e06d73989dc900bdef758f65e5c3364b2f3a19aa --dir preview-source
      - name: Verify every application file and generate the reviewed launchers
        shell: pwsh
        run: |
          $PreviewInfo = Get-Content preview-source/build-info.json -Raw | ConvertFrom-Json
          if ($PreviewInfo.sourceSha -ne 'e06d73989dc900bdef758f65e5c3364b2f3a19aa') { throw 'Unexpected preview source' }
          foreach ($PreviewFile in $PreviewInfo.files) {
            $PreviewHash = (Get-FileHash -LiteralPath (Join-Path preview-source/app $PreviewFile.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($PreviewHash -ne $PreviewFile.sha256) { throw 'Application checksum mismatch' }
          }
          New-Item -ItemType Directory -Path preview-output/portable -Force | Out-Null
          Copy-Item -LiteralPath preview-source/app -Destination preview-output/portable/app -Recurse
          Copy-Item LICENSE preview-output/portable/LICENSE.txt
          Copy-Item preview-source/build-info.json preview-output/portable/build-info.json
          @'
          const fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');
          const script=fs.readFileSync('scripts/package-windows-release.cjs','utf8');
          const start=script.indexOf('for (let profile = 1; profile <= 4; profile++)');
          const end=script.indexOf('const sourceSha =');
          if(start<0||end<start)throw Error('Launcher generator changed');
          vm.runInNewContext(script.slice(start,end),{fs,path,output:'preview-output',pkg:require('./package.json')});
          const warning='PRE-RELEASE DE VALIDACAO: QUATRO PERFIS\r\n\r\n'+
            'A reabertura e o encerramento de perfis NAO passaram no runner Windows.\r\n'+
            'Os quatro perfis iniciam, mas o processo adicional nao terminou no prazo.\r\n'+
            'Valide os quatro logins, a reabertura e a saida independente no seu Windows.\r\n'+
            'Nao trate este pacote como versao estavel. Nao envie credenciais ou perfis.\r\n\r\n';
          const readme='preview-output/portable/LEIA-ME.txt';
          fs.writeFileSync(readme,warning+fs.readFileSync(readme,'utf8'));
          fs.writeFileSync('preview-output/portable/PREVIEW.txt',warning);
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Launcher generation failed' }
          Compress-Archive -Path preview-output/portable/* -DestinationPath Twitchterino-0.1.3-four-profile-preview.zip
          $PreviewDigest = (Get-FileHash Twitchterino-0.1.3-four-profile-preview.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Preview ZIP SHA256: $PreviewDigest"
          "$PreviewDigest  Twitchterino-0.1.3-four-profile-preview.zip" | Set-Content -Encoding ascii Twitchterino-four-profile-preview-SHA256.txt
      - name: Upload only to the existing draft preview
        run: |
          $PreviewRelease = gh api repos/jggomes11/twitchterino/releases/435309079 | ConvertFrom-Json
          if (!$PreviewRelease.draft -or $PreviewRelease.tag_name -ne 'v0.1.3-rc.1') { throw 'Expected existing draft preview' }
          gh release upload v0.1.3-rc.1 Twitchterino-0.1.3-four-profile-preview.zip Twitchterino-four-profile-preview-SHA256.txt --repo jggomes11/twitchterino --clobber

