name: Windows validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runner:
        description: Native Windows environment
        type: choice
        options: [windows-2025, windows-2022]
        default: windows-2025
      release:
        description: Build Windows installer and portable release candidates
        type: boolean
        default: false
      publish_release:
        description: Publish verified release assets (main branch only, requires release)
        type: boolean
        default: false
      upload_preview:
        description: Prepare the source-pinned four-account test preview (not stable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}-${{ inputs.runner == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !inputs.upload_preview }}
    name: Native Windows UI and packaging
    runs-on: ${{ inputs.runner == 'windows-2022' && 'windows-2022' || 'windows-2025' }}
    timeout-minutes: 25
    env:
      VALIDATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Run security regression tests
        run: npm test
      - name: Validate native Electron session transport
        run: npm run test:electron
      - name: Validate public Twitch transport without an account
        run: node scripts/diagnose-twitch-public.cjs
      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev
      - name: Package Windows without publishing
        id: package
        run: |
          if ($env:BUILD_RELEASE -eq 'true') { npm run dist -- --win nsis --x64 --publish never }
          else { npm run dist -- --dir --publish never }
      - name: Validate packaged UI and official login navigation
        run: node scripts/validate-desktop.cjs
      - name: Validate four isolated profiles before release packaging
        if: success() && env.BUILD_RELEASE != 'true'
        timeout-minutes: 5
        run: node scripts/validate-profiles.cjs dist/win-unpacked/Twitchterino.exe validation-output/evidence/profile-validation.json
      - name: Prepare isolated manual validation bundle
        if: always() && steps.package.outcome == 'success'
        run: node scripts/package-windows-validation.cjs
      - name: Verify the manual bundle launcher
        if: always() && steps.package.outcome == 'success'
        run: ./validation-output/Start-WindowsValidation.ps1 -CheckOnly
      - name: Verify existing-profile selection stays inside the isolated profile root
        if: always() && steps.package.outcome == 'success'
        shell: pwsh
        run: |
          $ProbeProfile = Join-Path $env:LOCALAPPDATA 'ChannelClientValidation/twitchterino/000000000000'
          New-Item -ItemType Directory -Path $ProbeProfile -Force | Out-Null
          try { ./validation-output/Start-WindowsValidation.ps1 -CheckOnly -ProfileCommit '000000000000' }
          finally { Remove-Item -LiteralPath $ProbeProfile -Force }
      - name: Prepare Windows release candidates
        if: success() && env.BUILD_RELEASE == 'true'
        run: node scripts/package-windows-release.cjs
      - name: Validate four simultaneous isolated portable profiles
        if: success() && env.BUILD_RELEASE == 'true'
        timeout-minutes: 5
        run: node scripts/validate-profiles.cjs
      - name: Archive portable profiles and calculate release checksums
        if: success() && env.BUILD_RELEASE == 'true'
        run: |
          $ReleaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path release-output/portable/* -DestinationPath "release-output/Twitchterino-$ReleaseVersion-Windows-x64-4-contas.zip"
          Get-ChildItem release-output -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name | ForEach-Object {
            $ReleaseHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$ReleaseHash  $($_.Name)"
          } | Set-Content -Encoding ascii release-output/SHA256SUMS.txt
      - name: Preserve verified Windows release candidates
        if: success() && env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ github.sha }}
          path: |
            release-output/*.exe
            release-output/*.zip
            release-output/*.txt
            release-output/*.json
          retention-days: 7
          if-no-files-found: error
      - name: Preserve Windows evidence and validation build
        # The launcher checks hashes without opening another GUI during CI.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: validation-output/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn

  publish-release:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release && inputs.publish_release && !inputs.upload_preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download candidates from this successful Windows run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "windows-release-$GITHUB_SHA" --dir release-output
      - name: Verify source identity and asset checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release-output')
          package = json.loads(pathlib.Path('package.json').read_text())
          info = json.loads((root / 'release-build-info.json').read_text())
          version = package['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Expected stable release version'
          assert info['sourceSha'] == os.environ['GITHUB_SHA'], 'Unexpected candidate source'
          assert info['version'] == version and info['profiles'] == 4 and info['portableFormat'] == 'directory-zip'
          expected = {'Twitchterino-Setup.exe', f'Twitchterino-{version}-Windows-x64-4-contas.zip'}
          seen = set()
          for line in (root / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert name in expected and name not in seen, 'Unexpected or duplicate release asset'
              assert hashlib.file_digest((root / name).open('rb'), 'sha256').hexdigest() == digest, 'Asset checksum mismatch'
              seen.add(name)
          assert seen == expected, 'Missing release asset'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\nRELEASE_TAG=v{version}\n')
          print('Verified installer, four-account ZIP and source identity.')
          PY
      - name: Create draft, upload verified assets and publish
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Twitchterino $RELEASE_VERSION — quatro contas" --notes-file docs/releases/v0.1.3.pt-BR.md --draft
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-output/Twitchterino-Setup.exe "release-output/Twitchterino-$RELEASE_VERSION-Windows-x64-4-contas.zip" release-output/SHA256SUMS.txt release-output/release-build-info.json
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  upload-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_preview
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c072b78f1cfc14ee930bfed194a459fd5ea31a6
          persist-credentials: false
      - name: Download the pinned native Windows application
        run: gh run download 42344625130 --repo jggomes11/twitchterino --name windows-validation-7c072b78f1cfc14ee930bfed194a459fd5ea31a6 --dir preview-source
      - name: Verify every application file and generate the reviewed launchers
        shell: pwsh
        run: |
          $PreviewInfo = Get-Content preview-source/build-info.json -Raw | ConvertFrom-Json
          if ($PreviewInfo.sourceSha -ne '7c072b78f1cfc14ee930bfed194a459fd5ea31a6') { throw 'Unexpected preview source' }
          $PreviewAppRoot = (Resolve-Path preview-source/app).Path
          if (@(Get-ChildItem -LiteralPath $PreviewAppRoot -File -Recurse).Count -ne $PreviewInfo.files.Count) { throw 'Unexpected application file count' }
          foreach ($PreviewFile in $PreviewInfo.files) {
            $PreviewPath = [IO.Path]::GetFullPath((Join-Path $PreviewAppRoot $PreviewFile.path))
            if (!$PreviewPath.StartsWith($PreviewAppRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid application path' }
            $PreviewHash = (Get-FileHash -LiteralPath (Join-Path preview-source/app $PreviewFile.path) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($PreviewHash -ne $PreviewFile.sha256) { throw 'Application checksum mismatch' }
          }
          New-Item -ItemType Directory -Path preview-output/portable -Force | Out-Null
          Copy-Item -LiteralPath preview-source/app -Destination preview-output/portable/app -Recurse
          Copy-Item LICENSE preview-output/portable/LICENSE.txt
          Copy-Item preview-source/build-info.json preview-output/portable/build-info.json
          @'
          const fs=require('node:fs'),path=require('node:path'),vm=require('node:vm');
          const script=fs.readFileSync('scripts/package-windows-release.cjs','utf8');
          const start=script.indexOf('for (let profile = 1; profile <= 4; profile++)');
          const end=script.indexOf('const sourceSha =');
          if(start<0||end<start)throw Error('Launcher generator changed');
          vm.runInNewContext(script.slice(start,end),{fs,path,output:'preview-output',pkg:require('./package.json')});
          const warning='PRE-RELEASE DE VALIDACAO: QUATRO PERFIS\r\n\r\n'+
            'A validacao de quatro janelas NAO passou no runner Windows.\r\n'+
            'Os tres primeiros perfis responderam; a quarta janela deixou de responder.\r\n'+
            'Abra os quatro atalhos SEM fazer login e confira se todas as janelas respondem.\r\n'+
            'Somente depois disso, entre em uma conta diferente em cada janela oficial.\r\n'+
            'Nao trate este pacote como versao estavel. Nao envie credenciais ou perfis.\r\n\r\n';
          const readme='preview-output/portable/LEIA-ME.txt';
          fs.writeFileSync(readme,warning+fs.readFileSync(readme,'utf8'));
          fs.writeFileSync('preview-output/portable/PREVIEW.txt',warning);
          fs.writeFileSync('preview-output/NOTAS.md',
            'Prévia para validar quatro contas em janelas independentes. **Esta versão não é estável.**\n\n'+
            'A base contém as correções de segurança, sessão, baús e inicialização separada por conta. Os 70 testes e a validação de uma janela no Windows passaram. No teste simultâneo, os três primeiros perfis responderam e mantiveram cookies fictícios separados; a quarta janela deixou de responder nos runners Windows2022/2025. A causa ainda não foi estabelecida.\n\n'+
            'Baixe o ZIP, extraia tudo em uma pasta nova e abra Abrir-Conta-1.cmd até Abrir-Conta-4.cmd **antes de fazer login**. Confira se as quatro janelas respondem. Se alguma travar, interrompa o teste. Se todas responderem, faça login em uma conta diferente na janela oficial da Twitch de cada perfil.\n\n'+
            'Cada perfil usa duas lives com rotação: Todas as lives online desligado; Limite de lives2; Foco em bônus, Juntar pontos e Pegar baú sozinho ligados. Os atalhos mantêm pastas independentes em LOCALAPPDATA/Twitchterino-Profiles/Conta-N. Não é necessário instalar o aplicativo.\n\n'+
            'Fonte do aplicativo e dos atalhos: 7c072b78f1cfc14ee930bfed194a459fd5ea31a6. Compilação Windows42344625130. Nenhuma conta real foi usada no CI; nenhum cookie, token ou perfil pessoal acompanha o pacote. O PR2 permanece em rascunho, sem merge.\n');
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Launcher generation failed' }
          Compress-Archive -Path preview-output/portable/* -DestinationPath Twitchterino-0.1.3-rc.2-Windows-x64-4-contas.zip
          $PreviewDigest = (Get-FileHash Twitchterino-0.1.3-rc.2-Windows-x64-4-contas.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Preview ZIP SHA256: $PreviewDigest"
          "$PreviewDigest  Twitchterino-0.1.3-rc.2-Windows-x64-4-contas.zip" | Set-Content -Encoding ascii SHA256SUMS-rc.2.txt
      - name: Prepare the explicitly labelled prerelease draft
        run: |
          $PreviewRelease = gh api repos/jggomes11/twitchterino/releases/tags/v0.1.3-rc.2 | ConvertFrom-Json
          if (!$PreviewRelease.draft -or !$PreviewRelease.prerelease -or $PreviewRelease.tag_name -ne 'v0.1.3-rc.2' -or $PreviewRelease.target_commitish -ne '7c072b78f1cfc14ee930bfed194a459fd5ea31a6') { throw 'Unexpected preview identity' }
          gh release upload v0.1.3-rc.2 Twitchterino-0.1.3-rc.2-Windows-x64-4-contas.zip SHA256SUMS-rc.2.txt --repo jggomes11/twitchterino --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Preview upload failed; keeping the release as draft' }
      - name: Preserve the candidate for independent verification before publication
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: four-account-preview-7c072b78f1cfc14ee930bfed194a459fd5ea31a6
          path: |
            Twitchterino-0.1.3-rc.2-Windows-x64-4-contas.zip
            SHA256SUMS-rc.2.txt
            preview-output/NOTAS.md
          retention-days: 7
          if-no-files-found: error

