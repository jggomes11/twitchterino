name: Tauri Windows prototype
on:
  workflow_dispatch:
  push:
    branches: ['codex/tauri-performance-prototype']
    paths: ['prototype/**', '.github/workflows/tauri-prototype.yml']
permissions:
  contents: read
concurrency:
  group: tauri-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototype/src-tauri
          cache-on-failure: true
      - name: Test metrics process selection in both PowerShell versions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prototype/output | Out-Null
          & ./prototype/tests/metrics.test.ps1 -ProofPath ./prototype/output/metrics-pwsh.json
          & powershell.exe -NoProfile -File ./prototype/tests/metrics.test.ps1 -ProofPath ./prototype/output/metrics-windows-powershell.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell metrics tests failed' }
      - name: Prepare preserved interface
        run: node prototype/prepare-ui.cjs
      - name: Test bridge
        run: node --test prototype/tests/*.test.cjs
      - name: Test Rust contracts
        working-directory: prototype/src-tauri
        run: cargo test --release --locked
      - name: Build Windows executable
        working-directory: prototype/src-tauri
        run: cargo build --release --locked
      - name: Validate native profiles and IPC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force prototype/output | Out-Null
          $parseErrors = $null
          $parseTokens = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'prototype/Measure-Prototype.ps1'),[ref]$parseTokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $env:TERINO_SMOKE_ID = $env:GITHUB_RUN_ID
          foreach ($phase in @('write','read')) {
            $env:TERINO_SMOKE_PHASE = $phase
            $env:TERINO_SMOKE_OUTPUT = Join-Path $PWD "prototype/output/native-smoke-$phase.json"
            $testProcess = Start-Process prototype/src-tauri/target/release/terino-prototype.exe -ArgumentList '--smoke-test' -PassThru
            $cohort=@{}
            $deadline=[DateTime]::UtcNow.AddSeconds(120)
            do {
              $inventory=@(Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId)
              $ids=[Collections.Generic.HashSet[int]]::new()
              [void]$ids.Add($testProcess.Id)
              do { $added=$false; foreach ($entry in $inventory) { if ($ids.Contains([int]$entry.ParentProcessId) -and $ids.Add([int]$entry.ProcessId)) { $added=$true } } } while ($added)
              foreach ($processId in $ids) { $p=Get-Process -Id $processId -ErrorAction SilentlyContinue; if ($p) { try { $cohort[$processId]=$p.StartTime.ToUniversalTime().Ticks } catch {} } }
              $exited=$testProcess.WaitForExit(500)
            } while (-not $exited -and [DateTime]::UtcNow -lt $deadline)
            if (-not $exited) {
              Stop-Process -Id $testProcess.Id -Force -ErrorAction SilentlyContinue
              throw 'Native smoke timed out; cleanup is not a passing test.'
            }
            $childrenDeadline=[DateTime]::UtcNow.AddSeconds(15)
            do {
              $remaining=@(foreach ($processId in $cohort.Keys) { $p=Get-Process -Id $processId -ErrorAction SilentlyContinue; if ($p) { try { if ($p.StartTime.ToUniversalTime().Ticks -eq $cohort[$processId]) { $processId } } catch {} } })
              if ($remaining.Count -gt 0) { Start-Sleep -Milliseconds 500 }
            } while ($remaining.Count -gt 0 -and [DateTime]::UtcNow -lt $childrenDeadline)
            if ($remaining.Count -gt 0) { throw "Prototype left live processes: $remaining" }
            @{naturalExit=$true; descendantsExited=$true; processesObserved=$cohort.Count} | ConvertTo-Json | Set-Content "prototype/output/native-process-$phase.json"
            if ($testProcess.ExitCode -ne 0) {
              if (Test-Path $env:TERINO_SMOKE_OUTPUT) { Get-Content $env:TERINO_SMOKE_OUTPUT }
              throw "Native smoke failed: $($testProcess.ExitCode)"
            }
            $proof = Get-Content $env:TERINO_SMOKE_OUTPUT -Raw | ConvertFrom-Json
            if (-not $proof.passed -or $proof.accounts -ne 4 -or -not $proof.cookieIsolation -or -not $proof.remoteIpcDenied) { throw 'Incomplete native proof' }
            if ($phase -eq 'read' -and -not $proof.persistenceRead) { throw 'Persistence not proven' }
          }
          Copy-Item prototype/output/native-smoke-read.json prototype/output/native-smoke.json
      - name: Validate metrics collector on disposable helper
        shell: pwsh
        run: |
          $helper = Start-Process pwsh -ArgumentList '-NoProfile','-Command','Start-Sleep -Seconds 25' -PassThru
          $sampleDirectory = Join-Path $env:RUNNER_TEMP "collector-smoke-$env:GITHUB_RUN_ID"
          & ./prototype/Measure-Prototype.ps1 -RootProcessId $helper.Id -WarmupSeconds 0 -DurationSeconds 5 -OutputDirectory $sampleDirectory
          $metrics = Get-Content (Join-Path $sampleDirectory 'summary.json') -Raw | ConvertFrom-Json
          if ($metrics.samples -lt 1 -or $metrics.endedEarly -or $null -eq $metrics.privateBytes) { throw 'Collector did not produce valid helper samples' }
          if (-not $helper.WaitForExit(30000)) { Stop-Process -Id $helper.Id -Force; throw 'Disposable helper did not exit' }
          @{passed=$true; samples=$metrics.samples; residentCompleteSamples=$metrics.residentCompleteSamples; measuredApplication=$false; purpose='collector functionality only'} | ConvertTo-Json | Set-Content prototype/output/collector-smoke.json
      - name: Package prototype evidence
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $displayName = if ($package.name -eq 'kickterino') { 'Kickterino' } else { 'Twitchterino' }
          $binary = "$displayName-Tauri-Prototype.exe"
          Copy-Item prototype/src-tauri/target/release/terino-prototype.exe "prototype/output/$binary"
          Copy-Item prototype/README.md,prototype/Measure-Prototype.ps1,LICENSE prototype/output
          $metadata = @{ product=$displayName; prototype=$true; source=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; target='x86_64-pc-windows-msvc'; rust=(rustc --version); tauri='2.12.5'; realLoginValidated=$false; realPointsMeasured=$false; performanceMeasured=$false }
          $metadata | ConvertTo-Json | Set-Content prototype/output/build-info.json
          $hash = (Get-FileHash "prototype/output/$binary" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $binary" | Set-Content prototype/output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}-tauri-prototype-windows
          path: prototype/output/
          if-no-files-found: warn
